<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0018B2"/>
      <stop offset="100%" style="stop-color:#080808"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#146EF5"/>
      <stop offset="100%" style="stop-color:#0018B2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="300" fill="#146EF5" opacity="0.07"/>
  <circle cx="150" cy="530" r="200" fill="#146EF5" opacity="0.05"/>

  <!-- Left accent bar -->
  <rect x="80" y="160" width="6" height="310" rx="3" fill="url(#accent)"/>

  <!-- Company Name -->
  <text x="110" y="260" font-family="Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="4" fill="#146EF5">GLOBAL</text>
  <text x="110" y="340" font-family="Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="2" fill="#FFFFFF">HIGH TREND</text>

  <!-- Divider -->
  <rect x="110" y="365" width="520" height="3" rx="2" fill="#146EF5" opacity="0.6"/>

  <!-- Subtitle -->
  <text x="110" y="410" font-family="Arial, sans-serif" font-size="26" fill="rgba(255,255,255,0.75)" letter-spacing="1">General Trading L.L.C</text>

  <!-- Tagline -->
  <text x="110" y="460" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">Connecting Global Supply to Regional Demand</text>

  <!-- Bottom info -->
  <text x="110" y="550" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.4)">Business Bay, Dubai, UAE  ·  globalhightrend.com  ·  Est. 2021</text>

  <!-- Right icon grid -->
  <g transform="translate(820, 200)">
    <rect x="0" y="0" width="110" height="110" rx="16" fill="rgba(20,110,245,0.15)" stroke="#146EF5" stroke-width="1" stroke-opacity="0.3"/>
    <text x="55" y="55" font-family="Arial" font-size="36" text-anchor="middle" dominant-baseline="central" fill="#146EF5">⛽</text>
    <text x="55" y="95" font-family="Arial" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.5)">Oil &amp; Gas</text>

    <rect x="130" y="0" width="110" height="110" rx="16" fill="rgba(20,110,245,0.15)" stroke="#146EF5" stroke-width="1" stroke-opacity="0.3"/>
    <text x="185" y="55" font-family="Arial" font-size="36" text-anchor="middle" dominant-baseline="central" fill="#146EF5">🪵</text>
    <text x="185" y="95" font-family="Arial" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.5)">Eco Fuel</text>

    <rect x="0" y="130" width="110" height="110" rx="16" fill="rgba(20,110,245,0.15)" stroke="#146EF5" stroke-width="1" stroke-opacity="0.3"/>
    <text x="55" y="185" font-family="Arial" font-size="36" text-anchor="middle" dominant-baseline="central" fill="#146EF5">🏗️</text>
    <text x="55" y="225" font-family="Arial" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.5)">Machinery</text>

    <rect x="130" y="130" width="110" height="110" rx="16" fill="rgba(20,110,245,0.15)" stroke="#146EF5" stroke-width="1" stroke-opacity="0.3"/>
    <text x="185" y="185" font-family="Arial" font-size="36" text-anchor="middle" dominant-baseline="central" fill="#146EF5">☀️</text>
    <text x="185" y="225" font-family="Arial" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.5)">Renewable</text>
  </g>
</svg>
