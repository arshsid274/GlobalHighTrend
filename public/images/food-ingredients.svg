  <!-- Flavor Food Trading badge -->
  <rect x="240" y="60" width="320" height="100" rx="12" fill="white" stroke="#e0e6eb" stroke-width="2"/>
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#2d9a2d">FLAVOR FOOD TRADING FZE</text>
  <text x="400" y="122" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">Sister Company of Global High Trend General Trading L.L.C</text>
  <text x="400" y="142" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#146EF5">Premium Food Ingredients &amp; Raw Materials</text>

  <!-- Label bar -->
  <rect x="0" y="440" width="800" height="60" fill="rgba(45,154,45,0.9)"/>
  <text x="400" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="white">FOOD INGREDIENTS &amp; RAW MATERIALS</text>
  <text x="400" y="485" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.8)">Döhler · Symrise · BK Giulini · Lactalis · Friesland Campina</text>
</svg>
