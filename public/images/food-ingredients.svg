<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8f0"/>
      <stop offset="100%" style="stop-color:#e8f5e8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Lab / warehouse floor -->
  <rect x="0" y="380" width="800" height="120" fill="#f0f0f0"/>
  <rect x="0" y="378" width="800" height="4" fill="#dde5dd"/>

  <!-- Storage drums row 1 -->
  <g>
    <!-- Drum 1 -->
    <ellipse cx="130" cy="290" rx="45" ry="18" fill="#2a8a2a"/>
    <rect x="85" y="270" width="90" height="90" fill="#2d9a2d"/>
    <ellipse cx="130" cy="360" rx="45" ry="18" fill="#1e6e1e"/>
    <ellipse cx="130" cy="290" rx="45" ry="18" fill="#34b034"/>
    <text x="130" y="328" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="white">DÖHLER</text>
    <rect x="108" y="310" width="44" height="5" rx="2" fill="rgba(255,255,255,0.3)"/>
    <rect x="108" y="340" width="44" height="5" rx="2" fill="rgba(255,255,255,0.3)"/>

    <!-- Drum 2 -->
    <ellipse cx="260" cy="285" rx="45" ry="18" fill="#1a60b0"/>
    <rect x="215" y="265" width="90" height="90" fill="#1e6ec0"/>
    <ellipse cx="260" cy="355" rx="45" ry="18" fill="#144a90"/>
    <ellipse cx="260" cy="285" rx="45" ry="18" fill="#2278d0"/>
    <text x="260" y="323" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="white">SYMRISE</text>
    <rect x="238" y="305" width="44" height="5" rx="2" fill="rgba(255,255,255,0.3)"/>
    <rect x="238" y="335" width="44" height="5" rx="2" fill="rgba(255,255,255,0.3)"/>

    <!-- Drum 3 -->
    <ellipse cx="390" cy="290" rx="45" ry="18" fill="#c04020"/>
    <rect x="345" y="270" width="90" height="90" fill="#d04830"/>
    <ellipse cx="390" cy="360" rx="45" ry="18" fill="#a03018"/>
    <ellipse cx="390" cy="290" rx="45" ry="18" fill="#e05030"/>
    <text x="390" y="320" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="white">BK GIULINI</text>
    <rect x="368" y="310" width="44" height="5" rx="2" fill="rgba(255,255,255,0.3)"/>
    <rect x="368" y="340" width="44" height="5" rx="2" fill="rgba(255,255,255,0.3)"/>

    <!-- Drum 4 -->
    <ellipse cx="520" cy="285" rx="45" ry="18" fill="#c0a000"/>
    <rect x="475" y="265" width="90" height="90" fill="#d0b000"/>
    <ellipse cx="520" cy="355" rx="45" ry="18" fill="#a08000"/>
    <ellipse cx="520" cy="285" rx="45" ry="18" fill="#e0c000"/>
    <text x="520" y="315" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="white">LACTALIS</text>
    <rect x="498" y="305" width="44" height="5" rx="2" fill="rgba(255,255,255,0.3)"/>
    <rect x="498" y="335" width="44" height="5" rx="2" fill="rgba(255,255,255,0.3)"/>

    <!-- Drum 5 -->
    <ellipse cx="650" cy="290" rx="45" ry="18" fill="#106090"/>
    <rect x="605" y="270" width="90" height="90" fill="#1870a8"/>
    <ellipse cx="650" cy="360" rx="45" ry="18" fill="#0a4870"/>
    <ellipse cx="650" cy="290" rx="45" ry="18" fill="#2080b8"/>
    <text x="650" y="318" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" fill="white">FRIESLAND</text>
    <text x="650" y="330" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" fill="white">CAMPINA</text>
    <rect x="628" y="340" width="44" height="5" rx="2" fill="rgba(255,255,255,0.3)"/>
