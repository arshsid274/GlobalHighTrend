<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f8f0"/>
      <stop offset="100%" style="stop-color:#e0f0e0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Central logo card -->
  <rect x="150" y="100" width="500" height="220" rx="16" fill="white" stroke="#d0e8d0" stroke-width="2.5" filter="drop-shadow(0 4px 20px rgba(0,100,0,0.1))"/>

  <!-- Green header -->
  <rect x="150" y="100" width="500" height="80" rx="16" fill="#2d9a2d"/>
  <rect x="150" y="148" width="500" height="32" fill="#2d9a2d"/>

  <!-- Leaf icon -->
  <g transform="translate(195, 118)">
    <ellipse cx="20" cy="20" rx="20" ry="25" fill="rgba(255,255,255,0.2)" transform="rotate(-20, 20, 20)"/>
    <line x1="20" y1="45" x2="20" y2="10" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  </g>

  <!-- Company name -->
  <text x="400" y="148" font-family="Arial, sans-serif" font-size="22" font-weight="900" text-anchor="middle" fill="white">FLAVOR FOOD TRADING FZE</text>
  <text x="400" y="168" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.8)">Sister Company of Global High Trend General Trading L.L.C</text>

  <!-- Description -->
  <text x="400" y="220" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">Specialising in food ingredients trading, sourcing,</text>
  <text x="400" y="238" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">and supply for the food manufacturing industry</text>

  <!-- Partner badges -->
  <g>
    <rect x="180" y="265" width="80" height="28" rx="6" fill="#2d9a2d" opacity="0.15" stroke="#2d9a2d" stroke-width="1"/>
    <text x="220" y="283" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#2d9a2d">Döhler</text>

    <rect x="273" y="265" width="85" height="28" rx="6" fill="#1a60b0" opacity="0.1" stroke="#1a60b0" stroke-width="1"/>
    <text x="315" y="283" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#1a60b0">Symrise</text>

    <rect x="371" y="265" width="95" height="28" rx="6" fill="#c04020" opacity="0.1" stroke="#c04020" stroke-width="1"/>
    <text x="418" y="283" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#c04020">BK Giulini</text>

    <rect x="479" y="265" width="80" height="28" rx="6" fill="#c0a000" opacity="0.1" stroke="#c0a000" stroke-width="1"/>
    <text x="519" y="283" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#a08000">Lactalis</text>

    <rect x="270" y="305" width="130" height="28" rx="6" fill="#106090" opacity="0.1" stroke="#106090" stroke-width="1"/>
    <text x="335" y="323" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#106090">Friesland Campina</text>
  </g>

  <!-- Decorative herbs/leaves -->
  <g opacity="0.4" transform="translate(60, 150)">
    <ellipse cx="15" cy="20" rx="12" ry="22" fill="#4a9a4a" transform="rotate(-15, 15, 30)"/>
    <ellipse cx="35" cy="25" rx="10" ry="18" fill="#5aaa5a" transform="rotate(10, 35, 35)"/>
    <ellipse cx="25" cy="10" rx="8" ry="15" fill="#3a8a3a" transform="rotate(-5, 25, 20)"/>
  </g>
  <g opacity="0.4" transform="translate(690, 150)">
    <ellipse cx="15" cy="20" rx="12" ry="22" fill="#4a9a4a" transform="rotate(15, 15, 30)"/>
    <ellipse cx="35" cy="25" rx="10" ry="18" fill="#5aaa5a" transform="rotate(-10, 35, 35)"/>
    <ellipse cx="25" cy="10" rx="8" ry="15" fill="#3a8a3a" transform="rotate(5, 25, 20)"/>
  </g>

  <!-- Label bar -->
  <rect x="0" y="440" width="800" height="60" fill="rgba(45,154,45,0.9)"/>
  <text x="400" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="white">FLAVOR FOOD TRADING FZE</text>
  <text x="400" y="485" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.8)">Same Management as Global High Trend General Trading L.L.C</text>
</svg>
