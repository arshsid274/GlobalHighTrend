<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4fd"/>
      <stop offset="100%" style="stop-color:#b3d4f5"/>
    </linearGradient>
    <linearGradient id="tower" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0018B2"/>
      <stop offset="100%" style="stop-color:#146EF5"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Ground -->
  <rect x="0" y="400" width="800" height="100" fill="#e0e6eb"/>
  <rect x="0" y="395" width="800" height="10" fill="#c8d5df"/>

  <!-- Background buildings -->
  <rect x="50" y="250" width="100" height="150" fill="#b0c4d4" opacity="0.6"/>
  <rect x="600" y="220" width="120" height="180" fill="#b0c4d4" opacity="0.6"/>
  <rect x="650" y="200" width="80" height="200" fill="#a0b4c4" opacity="0.5"/>

  <!-- Burlington Tower main -->
  <rect x="250" y="100" width="300" height="300" fill="url(#tower)"/>
  <!-- Tower glass facade -->
  <g fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5">
    <!-- Window columns -->
    <rect x="270" y="120" width="30" height="260"/><rect x="312" y="120" width="30" height="260"/>
    <rect x="354" y="120" width="30" height="260"/><rect x="396" y="120" width="30" height="260"/>
    <rect x="438" y="120" width="30" height="260"/>
    <!-- Window rows horizontal -->
    <rect x="260" y="150" width="280" height="2"/><rect x="260" y="180" width="280" height="2"/>
    <rect x="260" y="210" width="280" height="2"/><rect x="260" y="240" width="280" height="2"/>
    <rect x="260" y="270" width="280" height="2"/><rect x="260" y="300" width="280" height="2"/>
    <rect x="260" y="330" width="280" height="2"/>
  </g>
  <!-- Tower top -->
  <polygon points="400,60 250,100 550,100" fill="#0018B2"/>
  <rect x="388" y="30" width="24" height="35" fill="#146EF5"/>
  <circle cx="400" cy="28" r="5" fill="#ff6600"/>

  <!-- Tower entrance -->
  <rect x="350" y="340" width="100" height="60" rx="4" fill="rgba(0,0,0,0.3)"/>
  <rect x="360" y="345" width="35" height="50" rx="2" fill="rgba(20,110,245,0.4)"/>
  <rect x="405" y="345" width="35" height="50" rx="2" fill="rgba(20,110,245,0.4)"/>

  <!-- Flag -->
  <line x1="388" y1="30" x2="388" y2="8" stroke="#333" stroke-width="1.5"/>
  <rect x="388" y="8" width="20" height="12" fill="#146EF5"/>

  <!-- Road markings -->
  <rect x="0" y="420" width="800" height="4" fill="rgba(0,24,178,0.15)"/>

  <!-- Sign -->
  <rect x="170" y="350" width="160" height="40" rx="6" fill="white" stroke="#e0e6eb" stroke-width="1.5"/>
  <text x="250" y="366" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#0018B2">BURLINGTON TOWER</text>
  <text x="250" y="381" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#333">Business Bay · Dubai</text>

  <!-- Label bar -->
  <rect x="0" y="440" width="800" height="60" fill="rgba(0,24,178,0.9)"/>
  <text x="400" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="white">GLOBAL HIGH TREND GENERAL TRADING L.L.C</text>
  <text x="400" y="485" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.65)">Burlington Tower, Office 410, Marasi Drive, Business Bay, Dubai, UAE</text>
</svg>
