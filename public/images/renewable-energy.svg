<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a6a"/>
      <stop offset="60%" style="stop-color:#2a5a9a"/>
      <stop offset="100%" style="stop-color:#c8e0f8"/>
    </linearGradient>
    <radialGradient id="sun" cx="80%" cy="20%" r="30%">
      <stop offset="0%" style="stop-color:#fff7a0"/>
      <stop offset="40%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Sun glow -->
  <circle cx="660" cy="100" r="80" fill="url(#sun)" opacity="0.6"/>
  <circle cx="660" cy="100" r="45" fill="#ffd700" opacity="0.9"/>
  <circle cx="660" cy="100" r="30" fill="#fff7a0"/>

  <!-- Sun rays -->
  <g stroke="#ffd700" stroke-width="2.5" opacity="0.6">
    <line x1="660" y1="40" x2="660" y2="20"/><line x1="700" y1="52" x2="712" y2="38"/>
    <line x1="720" y1="100" x2="740" y2="100"/><line x1="700" y1="148" x2="712" y2="162"/>
    <line x1="620" y1="52" x2="608" y2="38"/><line x1="600" y1="100" x2="580" y2="100"/>
    <line x1="620" y1="148" x2="608" y2="162"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="380" width="800" height="120" fill="#4a7a30"/>
  <rect x="0" y="376" width="800" height="8" fill="#3a6a20"/>

  <!-- Solar Panel Array 1 -->
  <g transform="translate(60, 230)">
    <rect x="0" y="0" width="120" height="80" rx="3" fill="#1a2060" stroke="#146EF5" stroke-width="1.5"/>
    <!-- Grid lines -->
    <line x1="30" y1="0" x2="30" y2="80" stroke="#146EF5" stroke-width="0.8" opacity="0.6"/>
    <line x1="60" y1="0" x2="60" y2="80" stroke="#146EF5" stroke-width="0.8" opacity="0.6"/>
    <line x1="90" y1="0" x2="90" y2="80" stroke="#146EF5" stroke-width="0.8" opacity="0.6"/>
    <line x1="0" y1="27" x2="120" y2="27" stroke="#146EF5" stroke-width="0.8" opacity="0.6"/>
    <line x1="0" y1="54" x2="120" y2="54" stroke="#146EF5" stroke-width="0.8" opacity="0.6"/>
    <!-- Reflection shimmer -->
    <rect x="0" y="0" width="120" height="80" rx="3" fill="url(#sun)" opacity="0.15"/>
    <!-- Support -->
    <line x1="20" y1="80" x2="10" y2="120" stroke="#888" stroke-width="3"/>
    <line x1="100" y1="80" x2="110" y2="120" stroke="#888" stroke-width="3"/>
  </g>

  <!-- Solar Panel Array 2 -->
  <g transform="translate(220, 220)">
    <rect x="0" y="0" width="120" height="80" rx="3" fill="#1a2060" stroke="#146EF5" stroke-width="1.5"/>
    <line x1="30" y1="0" x2="30" y2="80" stroke="#146EF5" stroke-width="0.8" opacity="0.6"/>
    <line x1="60" y1="0" x2="60" y2="80" stroke="#146EF5" stroke-width="0.8" opacity="0.6"/>
    <line x1="90" y1="0" x2="90" y2="80" stroke="#146EF5" stroke-width="0.8" opacity="0.6"/>
    <line x1="0" y1="27" x2="120" y2="27" stroke="#146EF5" stroke-width="0.8" opacity="0.6"/>
    <line x1="0" y1="54" x2="120" y2="54" stroke="#146EF5" stroke-width="0.8" opacity="0.6"/>
    <rect x="0" y="0" width="120" height="80" rx="3" fill="url(#sun)" opacity="0.2"/>
    <line x1="20" y1="80" x2="10" y2="120" stroke="#888" stroke-width="3"/>
    <line x1="100" y1="80" x2="110" y2="120" stroke="#888" stroke-width="3"/>
  </g>

  <!-- Solar Panel Array 3 (larger) -->
  <g transform="translate(380, 200)">
    <rect x="0" y="0" width="160" height="110" rx="3" fill="#1a2060" stroke="#146EF5" stroke-width="2"/>
    <line x1="40" y1="0" x2="40" y2="110" stroke="#146EF5" stroke-width="0.8" opacity="0.6"/>
    <line x1="80" y1="0" x2="80" y2="110" stroke="#146EF5" stroke-width="0.8" opacity="0.6"/>
    <line x1="120" y1="0" x2="120" y2="110" stroke="#146EF5" stroke-width="0.8" opacity="0.6"/>
    <line x1="0" y1="37" x2="160" y2="37" stroke="#146EF5" stroke-width="0.8" opacity="0.6"/>
    <line x1="0" y1="74" x2="160" y2="74" stroke="#146EF5" stroke-width="0.8" opacity="0.6"/>
    <rect x="0" y="0" width="160" height="110" rx="3" fill="url(#sun)" opacity="0.25"/>
    <line x1="25" y1="110" x2="15" y2="160" stroke="#888" stroke-width="3"/>
    <line x1="135" y1="110" x2="145" y2="160" stroke="#888" stroke-width="3"/>
  </g>

  <!-- Battery storage unit -->
  <rect x="590" y="260" width="140" height="100" rx="8" fill="#1a1a3a" stroke="#146EF5" stroke-width="2"/>
  <text x="660" y="295" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#146EF5">ENERGY</text>
  <text x="660" y="312" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#146EF5">STORAGE</text>
  <!-- Battery icon -->
  <rect x="630" y="325" width="60" height="22" rx="3" fill="#2a2a5a"/>
  <rect x="632" y="327" width="20" height="18" rx="2" fill="#146EF5"/>
  <rect x="654" y="327" width="12" height="18" rx="2" fill="#146EF5" opacity="0.6"/>
  <rect x="668" y="327" width="20" height="18" rx="2" fill="#146EF5" opacity="0.3"/>
  <rect x="688" y="331" width="4" height="10" rx="2" fill="#555"/>

  <!-- Energy flow arrows -->
  <g stroke="#ffd700" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 500 315 Q 545 290 590 310" marker-end="url(#arrow)"/>
  </g>

  <!-- Label bar -->
  <rect x="0" y="440" width="800" height="60" fill="rgba(20,110,245,0.9)"/>
  <text x="400" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="white">RENEWABLE ENERGY — SOLAR &amp; STORAGE</text>
  <text x="400" y="485" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.75)">Solar Panels · Energy Storage Systems · Clean Energy Solutions · UAE &amp; MENA</text>
</svg>
