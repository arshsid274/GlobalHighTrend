<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a20"/>
      <stop offset="100%" style="stop-color:#080818"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- World map dots (simplified) -->
  <g fill="#146EF5" opacity="0.15">
    <!-- Europe/Africa cluster -->
    <circle cx="380" cy="150" r="3"/><circle cx="390" cy="160" r="2"/><circle cx="370" cy="170" r="2.5"/>
    <circle cx="385" cy="180" r="2"/><circle cx="395" cy="190" r="2"/><circle cx="375" cy="200" r="2"/>
    <!-- Asia cluster -->
    <circle cx="550" cy="140" r="3"/><circle cx="570" cy="150" r="2.5"/><circle cx="580" cy="165" r="2"/>
    <circle cx="560" cy="175" r="2"/><circle cx="540" cy="160" r="2"/>
    <!-- UAE -->
    <circle cx="490" cy="185" r="5" fill="#146EF5" opacity="0.8"/>
    <!-- GCC -->
    <circle cx="470" cy="195" r="3"/><circle cx="500" cy="200" r="3"/>
    <!-- Americas -->
    <circle cx="200" cy="160" r="2.5"/><circle cx="210" cy="180" r="2"/><circle cx="190" cy="200" r="2"/>
    <circle cx="230" cy="175" r="2"/>
  </g>

  <!-- Trade route lines -->
  <g stroke="#146EF5" stroke-width="1.5" fill="none" stroke-dasharray="6,4" opacity="0.5">
    <!-- UAE to Europe -->
    <path d="M 490 185 Q 440 130 380 155"/>
    <!-- UAE to Asia -->
    <path d="M 490 185 Q 520 160 555 145"/>
    <!-- UAE to Americas -->
    <path d="M 490 185 Q 350 120 210 170"/>
    <!-- UAE to Africa -->
    <path d="M 490 185 Q 420 220 375 200"/>
  </g>

  <!-- Trade route dots (animated feel) -->
  <circle cx="435" cy="135" r="3.5" fill="#146EF5"/>
  <circle cx="350" cy="125" r="3.5" fill="#146EF5"/>
  <circle cx="520" cy="162" r="3.5" fill="#146EF5"/>

  <!-- Documents -->
  <!-- CIF Document -->
  <rect x="60" y="80" width="160" height="220" rx="8" fill="white" stroke="#e0e6eb" stroke-width="2" filter="drop-shadow(2px 4px 8px rgba(0,0,0,0.3))"/>
  <rect x="60" y="80" width="160" height="40" rx="8" fill="#146EF5"/>
  <text x="140" y="96" font-family="Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="white">CIF</text>
  <text x="140" y="112" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="rgba(255,255,255,0.8)">Cost Insurance Freight</text>
  <!-- Document lines -->
  <g fill="#e0e6eb">
    <rect x="80" y="135" width="120" height="8" rx="3"/>
    <rect x="80" y="153" width="100" height="8" rx="3"/>
    <rect x="80" y="171" width="110" height="8" rx="3"/>
    <rect x="80" y="189" width="90" height="8" rx="3"/>
    <rect x="80" y="207" width="105" height="8" rx="3"/>
    <rect x="80" y="225" width="80" height="8" rx="3"/>
  </g>
  <!-- Stamp -->
  <circle cx="185" cy="270" r="22" stroke="#2d9a2d" stroke-width="2" fill="none"/>
  <text x="185" y="265" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle" fill="#2d9a2d">APPROVED</text>
  <text x="185" y="277" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#2d9a2d">✓ VERIFIED</text>

  <!-- L/C Document -->
  <rect x="280" y="100" width="160" height="220" rx="8" fill="white" stroke="#e0e6eb" stroke-width="2" filter="drop-shadow(2px 4px 8px rgba(0,0,0,0.3))"/>
  <rect x="280" y="100" width="160" height="40" rx="8" fill="#0018B2"/>
  <text x="360" y="116" font-family="Arial, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="white">L/C</text>
  <text x="360" y="132" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="rgba(255,255,255,0.8)">Letter of Credit</text>
  <g fill="#e0e6eb">
    <rect x="300" y="155" width="120" height="8" rx="3"/>
    <rect x="300" y="173" width="100" height="8" rx="3"/>
    <rect x="300" y="191" width="110" height="8" rx="3"/>
    <rect x="300" y="209" width="90" height="8" rx="3"/>
    <rect x="300" y="227" width="105" height="8" rx="3"/>
    <rect x="300" y="245" width="80" height="8" rx="3"/>
  </g>
  <circle cx="405" cy="295" r="22" stroke="#146EF5" stroke-width="2" fill="none"/>
  <text x="405" y="290" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle" fill="#146EF5">ISSUED</text>
  <text x="405" y="302" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#146EF5">BANK CERT.</text>

  <!-- Incoterms pills -->
  <g>
    <rect x="540" y="100" width="60" height="30" rx="6" fill="#146EF5"/>
    <text x="570" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="white">CIF</text>

    <rect x="610" y="100" width="60" height="30" rx="6" fill="#0018B2"/>
    <text x="640" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="white">FOB</text>

    <rect x="540" y="140" width="60" height="30" rx="6" fill="#080808"/>
    <text x="570" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="white">EXW</text>

    <rect x="610" y="140" width="60" height="30" rx="6" fill="#333"/>
    <text x="640" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="white">DDP</text>

    <rect x="540" y="180" width="130" height="30" rx="6" fill="#146EF5" opacity="0.3" stroke="#146EF5" stroke-width="1.5"/>
    <text x="605" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#146EF5">LETTER OF CREDIT</text>

    <rect x="540" y="220" width="130" height="30" rx="6" fill="#0018B2" opacity="0.3" stroke="#0018B2" stroke-width="1.5"/>
    <text x="605" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="rgba(255,255,255,0.8)">WIRE TRANSFER</text>
  </g>

  <!-- Label bar -->
  <rect x="0" y="440" width="800" height="60" fill="rgba(20,110,245,0.2)" stroke-top="#146EF5"/>
  <rect x="0" y="440" width="800" height="2" fill="#146EF5"/>
  <text x="400" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#146EF5">CIF / L/C TRADE &amp; GENERAL TRADING</text>
  <text x="400" y="485" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.5)">Secure International Transactions · CIF · FOB · EXW · DDP · Letter of Credit</text>
</svg>
