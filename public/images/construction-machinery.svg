<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d0e8f5"/>
      <stop offset="100%" style="stop-color:#e8f4fb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Ground -->
  <rect x="0" y="380" width="800" height="120" fill="#c8a870"/>
  <rect x="0" y="378" width="800" height="6" fill="#a88850"/>

  <!-- Tower Crane -->
  <g>
    <!-- Mast -->
    <rect x="100" y="100" width="20" height="280" fill="#f5a200"/>
    <!-- Jib (horizontal arm) -->
    <rect x="20" y="100" width="260" height="15" fill="#f5a200"/>
    <!-- Counter jib -->
    <rect x="100" y="100" width="80" height="12" fill="#e09000"/>
    <!-- Hook rope -->
    <line x1="80" y1="115" x2="80" y2="240" stroke="#555" stroke-width="2"/>
    <rect x="72" y="238" width="16" height="20" rx="2" fill="#555"/>
    <!-- Cabin -->
    <rect x="92" y="85" width="36" height="30" rx="3" fill="#146EF5"/>
    <rect x="96" y="89" width="12" height="12" rx="1" fill="rgba(255,255,255,0.5)"/>
    <!-- Diagonal struts -->
    <line x1="110" y1="100" x2="20" y2="115" stroke="#e09000" stroke-width="3"/>
    <line x1="110" y1="100" x2="280" y2="115" stroke="#e09000" stroke-width="3"/>
    <!-- Base -->
    <rect x="88" y="380" width="44" height="20" fill="#888"/>
  </g>

  <!-- Excavator -->
  <g transform="translate(370, 260)">
    <!-- Tracks -->
    <rect x="-20" y="100" width="200" height="30" rx="8" fill="#333"/>
    <rect x="-10" y="103" width="180" height="24" rx="6" fill="#444"/>
    <!-- Wheels -->
    <circle cx="10" cy="115" r="16" fill="#222"/><circle cx="10" cy="115" r="9" fill="#555"/>
    <circle cx="150" cy="115" r="16" fill="#222"/><circle cx="150" cy="115" r="9" fill="#555"/>
    <!-- Body -->
    <rect x="10" y="60" width="140" height="50" rx="6" fill="#f5a200"/>
    <rect x="20" y="65" width="50" height="30" rx="4" fill="rgba(255,255,255,0.2)"/>
    <!-- Cab -->
    <rect x="90" y="30" width="70" height="45" rx="6" fill="#e09000"/>
    <rect x="95" y="35" width="25" height="18" rx="2" fill="rgba(255,255,255,0.4)"/>
    <!-- Boom arm -->
    <rect x="-25" y="20" width="80" height="16" rx="5" fill="#cc8800" transform="rotate(-30, 15, 75)"/>
    <!-- Stick -->
    <rect x="-60" y="-10" width="65" height="12" rx="4" fill="#bb7700" transform="rotate(10, -30, 30)"/>
    <!-- Bucket -->
    <path d="M -95 -30 L -115 -50 L -80 -55 L -70 -35 Z" fill="#aaa" transform="rotate(5, -90, -40)"/>
  </g>

  <!-- Partner badges -->
  <rect x="550" y="80" width="100" height="35" rx="6" fill="white" stroke="#e0e6eb" stroke-width="1.5"/>
  <text x="600" y="103" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#0018B2">ZOOMLION</text>

  <rect x="660" y="80" width="90" height="35" rx="6" fill="white" stroke="#e0e6eb" stroke-width="1.5"/>
  <text x="705" y="103" font-family="Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#cc0000">XCMG</text>

  <rect x="555" y="125" width="80" height="35" rx="6" fill="white" stroke="#e0e6eb" stroke-width="1.5"/>
  <text x="595" y="148" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#333">KERUI</text>

  <!-- Dust/dirt particles -->
  <circle cx="380" cy="375" r="3" fill="#c8a870" opacity="0.6"/>
  <circle cx="420" cy="370" r="2" fill="#c8a870" opacity="0.5"/>
  <circle cx="460" cy="373" r="4" fill="#c8a870" opacity="0.4"/>

  <!-- Label bar -->
  <rect x="0" y="440" width="800" height="60" fill="rgba(0,24,178,0.9)"/>
  <text x="400" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="white">CONSTRUCTION &amp; INDUSTRIAL MACHINERY</text>
  <text x="400" y="485" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.65)">Zoomlion · XCMG · Kerui · SLC · Oil Dynamics · COIN</text>
</svg>
