<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0"/>
      <stop offset="100%" style="stop-color:#e0e8f0"/>
    </linearGradient>
    <radialGradient id="metal" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#c8c8c8"/>
      <stop offset="100%" style="stop-color:#888"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Workshop floor -->
  <rect x="0" y="380" width="800" height="120" fill="#d8d8d8"/>
  <rect x="0" y="378" width="800" height="5" fill="#c0c0c0"/>
  <!-- Floor tiles -->
  <g fill="none" stroke="#c8c8c8" stroke-width="1" opacity="0.5">
    <line x1="0" y1="400" x2="800" y2="400"/><line x1="0" y1="430" x2="800" y2="430"/><line x1="0" y1="460" x2="800" y2="460"/>
    <line x1="100" y1="380" x2="100" y2="500"/><line x1="200" y1="380" x2="200" y2="500"/><line x1="300" y1="380" x2="300" y2="500"/>
    <line x1="400" y1="380" x2="400" y2="500"/><line x1="500" y1="380" x2="500" y2="500"/><line x1="600" y1="380" x2="600" y2="500"/>
    <line x1="700" y1="380" x2="700" y2="500"/>
  </g>

  <!-- Engine block -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="180" height="140" rx="8" fill="#555"/>
    <rect x="10" y="10" width="160" height="120" rx="4" fill="#666"/>
    <!-- Cylinders -->
    <ellipse cx="45" cy="20" rx="20" ry="12" fill="#888"/>
    <ellipse cx="90" cy="20" rx="20" ry="12" fill="#888"/>
    <ellipse cx="135" cy="20" rx="20" ry="12" fill="#888"/>
    <!-- Bolts -->
    <g fill="#aaa">
      <circle cx="15" cy="15" r="5"/><circle cx="165" cy="15" r="5"/>
      <circle cx="15" cy="125" r="5"/><circle cx="165" cy="125" r="5"/>
    </g>
    <!-- Label -->
    <text x="90" y="85" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="rgba(255,255,255,0.7)">ENGINE BLOCK</text>
    <text x="90" y="103" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.4)">OEM QUALITY</text>
  </g>

  <!-- Wheel / Tire -->
  <g transform="translate(320, 100)">
    <circle cx="100" cy="100" r="100" fill="#222"/>
    <circle cx="100" cy="100" r="75" fill="#111"/>
    <circle cx="100" cy="100" r="55" fill="#555"/>
    <circle cx="100" cy="100" r="35" fill="url(#metal)"/>
    <!-- Spokes -->
    <line x1="100" y1="65" x2="100" y2="35" stroke="#666" stroke-width="8"/>
    <line x1="130" y1="74" x2="148" y2="52" stroke="#666" stroke-width="8"/>
    <line x1="135" y1="110" x2="163" y2="110" stroke="#666" stroke-width="8"/>
    <line x1="65" y1="74" x2="47" y2="52" stroke="#666" stroke-width="8"/>
    <line x1="65" y1="126" x2="47" y2="148" stroke="#666" stroke-width="8"/>
    <!-- Hub -->
    <circle cx="100" cy="100" r="15" fill="#aaa"/>
    <circle cx="100" cy="100" r="8" fill="#888"/>
    <!-- Tire tread marks -->
    <path d="M 5 85 Q 0 100 5 115" stroke="#333" stroke-width="3" fill="none"/>
    <path d="M 195 85 Q 200 100 195 115" stroke="#333" stroke-width="3" fill="none"/>
  </g>

  <!-- Gearbox / Transmission -->
  <g transform="translate(560, 130)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="#4a4a4a"/>
    <rect x="8" y="8" width="144" height="104" rx="7" fill="#5a5a5a"/>
    <!-- Gear teeth decoration -->
    <g fill="#6a6a6a">
      <rect x="20" y="35" width="12" height="50" rx="3"/>
      <rect x="42" y="25" width="12" height="70" rx="3"/>
      <rect x="64" y="30" width="12" height="60" rx="3"/>
      <rect x="86" y="20" width="12" height="80" rx="3"/>
      <rect x="108" y="35" width="12" height="50" rx="3"/>
      <rect x="130" y="28" width="12" height="64" rx="3"/>
    </g>
    <text x="80" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="rgba(255,255,255,0.6)">TRANSMISSION</text>
  </g>

  <!-- Parts label tags -->
  <g>
    <rect x="82" y="110" width="70" height="20" rx="4" fill="#146EF5"/>
    <text x="117" y="124" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="white">OEM</text>

    <rect x="562" y="110" width="100" height="20" rx="4" fill="#0018B2"/>
    <text x="612" y="124" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="white">AFTERMARKET</text>
  </g>

  <!-- Shelf in background -->
  <rect x="0" y="60" width="800" height="8" fill="#ccc" opacity="0.4"/>
  <rect x="0" y="320" width="800" height="8" fill="#ccc" opacity="0.4"/>

  <!-- Label bar -->
  <rect x="0" y="440" width="800" height="60" fill="rgba(0,24,178,0.9)"/>
  <text x="400" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="white">AUTOMOTIVE PARTS — OEM &amp; AFTERMARKET</text>
  <text x="400" y="485" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.65)">Quality-Certified Global Suppliers · Wholesalers · Retailers · Service Centers</text>
</svg>
