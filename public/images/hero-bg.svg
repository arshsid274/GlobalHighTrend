<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080818"/>
      <stop offset="50%" style="stop-color:#0018B2"/>
      <stop offset="100%" style="stop-color:#080808"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0018B2;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#000010;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <!-- Sky / background -->
  <rect width="1440" height="800" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="white" opacity="0.4">
    <circle cx="100" cy="80" r="1.5"/><circle cx="250" cy="50" r="1"/><circle cx="400" cy="90" r="1.5"/>
    <circle cx="600" cy="40" r="1"/><circle cx="750" cy="70" r="2"/><circle cx="900" cy="55" r="1"/>
    <circle cx="1100" cy="85" r="1.5"/><circle cx="1300" cy="45" r="1"/><circle cx="1380" cy="70" r="1.5"/>
    <circle cx="180" cy="130" r="1"/><circle cx="520" cy="120" r="1.5"/><circle cx="870" cy="110" r="1"/>
    <circle cx="1200" cy="140" r="1.5"/><circle cx="1050" cy="30" r="1"/>
  </g>

  <!-- Skyline silhouette - Business Bay / Dubai -->
  <g fill="#0d0d2a">
    <!-- Burj Khalifa simplified -->
    <rect x="680" y="150" width="20" height="400"/>
    <polygon points="690,100 680,150 700,150" fill="#0d0d2a"/>

    <!-- Buildings left -->
    <rect x="200" y="350" width="60" height="200"/>
    <rect x="270" y="320" width="50" height="230"/>
    <rect x="330" y="380" width="70" height="170"/>
    <rect x="410" y="300" width="55" height="250"/>
    <rect x="475" y="360" width="65" height="190"/>
    <rect x="550" y="280" width="60" height="270"/>
    <rect x="620" y="330" width="50" height="220"/>

    <!-- Buildings right -->
    <rect x="720" y="280" width="65" height="270"/>
    <rect x="795" y="350" width="55" height="200"/>
    <rect x="860" y="310" width="70" height="240"/>
    <rect x="940" y="370" width="60" height="180"/>
    <rect x="1010" y="290" width="55" height="260"/>
    <rect x="1075" y="340" width="65" height="210"/>
    <rect x="1150" y="380" width="50" height="170"/>
    <rect x="1210" y="320" width="70" height="230"/>

    <!-- Windows glow -->
  </g>

  <!-- Building windows -->
  <g fill="#146EF5" opacity="0.5">
    <rect x="415" y="315" width="8" height="5" rx="1"/><rect x="428" y="315" width="8" height="5" rx="1"/>
    <rect x="415" y="328" width="8" height="5" rx="1"/><rect x="428" y="328" width="8" height="5" rx="1"/>
    <rect x="555" y="295" width="8" height="5" rx="1"/><rect x="568" y="295" width="8" height="5" rx="1"/>
    <rect x="555" y="310" width="8" height="5" rx="1"/><rect x="568" y="310" width="8" height="5" rx="1"/>
    <rect x="725" y="295" width="9" height="5" rx="1"/><rect x="740" y="295" width="9" height="5" rx="1"/>
    <rect x="725" y="310" width="9" height="5" rx="1"/><rect x="740" y="310" width="9" height="5" rx="1"/>
    <rect x="1015" y="305" width="8" height="5" rx="1"/><rect x="1028" y="305" width="8" height="5" rx="1"/>
    <rect x="1080" y="355" width="8" height="5" rx="1"/><rect x="1093" y="355" width="8" height="5" rx="1"/>
  </g>

  <!-- Water / reflection -->
  <rect x="0" y="550" width="1440" height="250" fill="url(#water)"/>

  <!-- Ship silhouette -->
  <g fill="#0a0a1a" transform="translate(150, 480)">
    <rect x="0" y="30" width="280" height="35" rx="4"/>
    <polygon points="0,30 20,0 260,0 280,30" fill="#0a0a1a"/>
    <rect x="60" y="-60" width="15" height="60"/>
    <rect x="180" y="-80" width="12" height="80"/>
    <rect x="40" y="-20" width="180" height="5" rx="2"/>
  </g>

  <!-- Cargo ship right -->
  <g fill="#080818" transform="translate(900, 490)">
    <rect x="0" y="25" width="320" height="30" rx="4"/>
    <polygon points="0,25 15,0 305,0 320,25" fill="#080818"/>
    <rect x="80" y="-50" width="12" height="50"/>
    <rect x="200" y="-70" width="10" height="70"/>
  </g>

  <!-- Global network dots -->
  <g fill="#146EF5" opacity="0.6">
    <circle cx="200" cy="200" r="3"/>
    <circle cx="500" cy="180" r="3"/>
    <circle cx="800" cy="190" r="3"/>
    <circle cx="1100" cy="175" r="3"/>
    <circle cx="1350" cy="200" r="3"/>
    <!-- Connecting lines -->
    <line x1="200" y1="200" x2="500" y2="180" stroke="#146EF5" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="500" y1="180" x2="800" y2="190" stroke="#146EF5" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="800" y1="190" x2="1100" y2="175" stroke="#146EF5" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="1100" y1="175" x2="1350" y2="200" stroke="#146EF5" stroke-width="0.5" stroke-opacity="0.3"/>
  </g>

  <!-- Brand watermark -->
  <text x="720" y="760" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="rgba(255,255,255,0.2)" letter-spacing="3">GLOBAL HIGH TREND GENERAL TRADING L.L.C — BUSINESS BAY, DUBAI, UAE</text>
</svg>
