<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2d1a00"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6600;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ff6600;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Briquette shapes -->
  <g opacity="0.9">
    <!-- Row 1 -->
    <rect x="120" y="200" width="90" height="65" rx="8" fill="#2a2a2a" stroke="#444" stroke-width="1.5"/>
    <rect x="120" y="200" width="90" height="10" rx="4" fill="#3a3a3a"/>
    <rect x="225" y="185" width="90" height="65" rx="8" fill="#2a2a2a" stroke="#444" stroke-width="1.5"/>
    <rect x="225" y="185" width="90" height="10" rx="4" fill="#3a3a3a"/>
    <rect x="330" y="195" width="90" height="65" rx="8" fill="#2a2a2a" stroke="#444" stroke-width="1.5"/>
    <rect x="330" y="195" width="90" height="10" rx="4" fill="#3a3a3a"/>
    <rect x="435" y="188" width="90" height="65" rx="8" fill="#2a2a2a" stroke="#444" stroke-width="1.5"/>
    <rect x="435" y="188" width="90" height="10" rx="4" fill="#3a3a3a"/>
    <rect x="540" y="200" width="90" height="65" rx="8" fill="#2a2a2a" stroke="#444" stroke-width="1.5"/>
    <rect x="540" y="200" width="90" height="10" rx="4" fill="#3a3a3a"/>
    <!-- Row 2 -->
    <rect x="160" y="270" width="90" height="65" rx="8" fill="#252525" stroke="#444" stroke-width="1.5"/>
    <rect x="265" y="260" width="90" height="65" rx="8" fill="#252525" stroke="#444" stroke-width="1.5"/>
    <rect x="370" y="265" width="90" height="65" rx="8" fill="#252525" stroke="#444" stroke-width="1.5"/>
    <rect x="475" y="258" width="90" height="65" rx="8" fill="#252525" stroke="#444" stroke-width="1.5"/>
    <!-- Row 3 -->
    <rect x="200" y="330" width="90" height="65" rx="8" fill="#202020" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="305" y="325" width="90" height="65" rx="8" fill="#202020" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="410" y="328" width="90" height="65" rx="8" fill="#202020" stroke="#3a3a3a" stroke-width="1.5"/>
  </g>

  <!-- Embers/glow -->
  <circle cx="310" cy="230" r="4" fill="#ff6600" opacity="0.8"/>
  <circle cx="450" cy="220" r="3" fill="#ff8800" opacity="0.7"/>
  <circle cx="380" cy="240" r="2.5" fill="#ffaa00" opacity="0.6"/>
  <circle cx="520" cy="235" r="3" fill="#ff6600" opacity="0.5"/>

  <!-- Badge -->
  <rect x="60" y="60" width="220" height="36" rx="18" fill="#146EF5"/>
  <text x="170" y="83" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="white" letter-spacing="1">FLAGSHIP PRODUCT</text>

  <!-- Title -->
  <text x="60" y="150" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="white">Sawdust Briquette</text>
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#146EF5">Charcoal</text>

  <!-- Bottom label -->
  <rect x="0" y="440" width="800" height="60" fill="rgba(20,110,245,0.15)"/>
  <text x="400" y="476" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="rgba(255,255,255,0.6)" letter-spacing="1">ECO-FRIENDLY · LOW EMISSIONS · BULK EXPORT AVAILABLE · CIF / L/C TERMS</text>
</svg>
