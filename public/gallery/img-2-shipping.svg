<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="ocean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a3a"/><stop offset="100%" style="stop-color:#1a3a6a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" fill="url(#ocean)"/>
  <rect x="0" y="300" width="640" height="100" fill="#0d2a50"/>
  <!-- Water waves -->
  <path d="M 0 300 Q 80 290 160 300 Q 240 310 320 300 Q 400 290 480 300 Q 560 310 640 300 L 640 320 Q 560 330 480 320 Q 400 310 320 320 Q 240 330 160 320 Q 80 310 0 320 Z" fill="#1a3a6a" opacity="0.5"/>
  <!-- Container ship hull -->
  <path d="M 60 220 L 580 220 L 600 260 L 40 260 Z" fill="#cc4400"/>
  <rect x="60" y="200" width="520" height="22" fill="#cc4400"/>
  <rect x="60" y="195" width="520" height="8" fill="#dd5500"/>
  <!-- Containers on deck -->
  <g>
    <rect x="80" y="135" width="65" height="60" fill="#146EF5"/><rect x="80" y="135" width="65" height="4" fill="#1a7aff"/>
    <rect x="150" y="135" width="65" height="60" fill="#cc0000"/><rect x="150" y="135" width="65" height="4" fill="#dd1111"/>
    <rect x="220" y="135" width="65" height="60" fill="#00aa44"/><rect x="220" y="135" width="65" height="4" fill="#00bb55"/>
    <rect x="290" y="135" width="65" height="60" fill="#ff8800"/><rect x="290" y="135" width="65" height="4" fill="#ff9900"/>
    <rect x="360" y="135" width="65" height="60" fill="#146EF5"/><rect x="360" y="135" width="65" height="4" fill="#1a7aff"/>
    <rect x="430" y="135" width="65" height="60" fill="#cc0000"/><rect x="430" y="135" width="65" height="4" fill="#dd1111"/>
    <rect x="500" y="135" width="50" height="60" fill="#00aa44"/><rect x="500" y="135" width="50" height="4" fill="#00bb55"/>
    <!-- Upper tier -->
    <rect x="130" y="80" width="65" height="55" fill="#ff8800"/>
    <rect x="200" y="80" width="65" height="55" fill="#146EF5"/>
    <rect x="270" y="80" width="65" height="55" fill="#cc0000"/>
    <rect x="340" y="80" width="65" height="55" fill="#00aa44"/>
    <rect x="410" y="80" width="65" height="55" fill="#ff8800"/>
  </g>
  <!-- Ship bridge/cabin -->
  <rect x="480" y="60" width="90" height="80" fill="#888" stroke="#aaa" stroke-width="1"/>
  <rect x="490" y="68" width="30" height="25" rx="2" fill="rgba(135,206,235,0.6)"/>
  <!-- Funnel -->
  <rect x="530" y="30" width="20" height="35" fill="#666"/>
  <rect x="525" y="28" width="30" height="8" fill="#555"/>
  <!-- Smoke -->
  <ellipse cx="540" cy="22" rx="8" ry="6" fill="#aaa" opacity="0.4"/>
  <ellipse cx="538" cy="12" rx="6" ry="5" fill="#bbb" opacity="0.3"/>

  <!-- Brand badge -->
  <rect x="0" y="350" width="640" height="50" fill="rgba(0,24,178,0.95)"/>
  <text x="320" y="380" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle" fill="white">INTERNATIONAL EXPORT LOGISTICS — CIF / L/C OPERATIONS</text>
</svg>
