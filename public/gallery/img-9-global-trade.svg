<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060618"/><stop offset="100%" style="stop-color:#0a0a25"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <!-- Globe wireframe -->
  <circle cx="320" cy="190" r="155" fill="none" stroke="#146EF5" stroke-width="0.8" opacity="0.3"/>
  <circle cx="320" cy="190" r="155" fill="rgba(20,110,245,0.03)"/>
  <!-- Latitude lines -->
  <g stroke="#146EF5" stroke-width="0.5" opacity="0.2" fill="none">
    <ellipse cx="320" cy="190" rx="155" ry="45"/>
    <ellipse cx="320" cy="190" rx="155" ry="100"/>
    <ellipse cx="320" cy="190" rx="155" ry="140"/>
    <ellipse cx="320" cy="120" rx="155" ry="45" transform="rotate(-20, 320, 190)"/>
  </g>
  <!-- Longitude lines -->
  <g stroke="#146EF5" stroke-width="0.5" opacity="0.2" fill="none">
    <line x1="320" y1="35" x2="320" y2="345"/>
    <ellipse cx="320" cy="190" rx="50" ry="155"/>
    <ellipse cx="320" cy="190" rx="100" ry="155"/>
    <ellipse cx="320" cy="190" rx="130" ry="155"/>
  </g>

  <!-- UAE/Dubai marker -->
  <circle cx="420" cy="205" r="8" fill="#ff6600"/>
  <circle cx="420" cy="205" r="4" fill="#ffaa00"/>
  <circle cx="420" cy="205" r="18" fill="#ff6600" opacity="0.15"/>
  <text x="440" y="200" font-family="Arial" font-size="10" font-weight="700" fill="#ffaa00">Dubai</text>

  <!-- Key city markers -->
  <circle cx="280" cy="170" r="5" fill="#146EF5" opacity="0.8"/>
  <text x="260" y="165" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.5)">London</text>

  <circle cx="365" cy="175" r="5" fill="#146EF5" opacity="0.8"/>
  <text x="370" y="170" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.5)">Mumbai</text>

  <circle cx="470" cy="160" r="5" fill="#146EF5" opacity="0.8"/>
  <text x="476" y="156" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.5)">Shanghai</text>

  <circle cx="380" cy="215" r="5" fill="#146EF5" opacity="0.8"/>
  <text x="386" y="228" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.5)">Riyadh</text>

  <circle cx="350" cy="195" r="5" fill="#146EF5" opacity="0.8"/>
  <text x="326" y="190" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.5)">Kuwait</text>

  <!-- Trade routes -->
  <g stroke="#146EF5" stroke-width="1.2" fill="none" opacity="0.4" stroke-dasharray="4,3">
    <path d="M 420 205 Q 350 185 280 170"/>
    <path d="M 420 205 Q 393 190 365 175"/>
    <path d="M 420 205 Q 445 182 470 160"/>
    <path d="M 420 205 Q 400 210 380 215"/>
    <path d="M 420 205 Q 385 200 350 195"/>
  </g>

  <!-- Moving dots on routes -->
  <circle cx="350" cy="188" r="3" fill="#ffd700"/>
  <circle cx="393" cy="190" r="3" fill="#ffd700"/>
  <circle cx="445" cy="183" r="3" fill="#ffd700"/>

  <!-- Stats overlay -->
  <rect x="30" y="50" width="130" height="70" rx="8" fill="rgba(20,110,245,0.15)" stroke="#146EF5" stroke-width="1" stroke-opacity="0.4"/>
  <text x="95" y="76" font-family="Arial" font-size="22" font-weight="900" text-anchor="middle" fill="#146EF5">GCC+</text>
  <text x="95" y="96" font-family="Arial" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.5)">Markets Served</text>
  <text x="95" y="112" font-family="Arial" font-size="9" text-anchor="middle" fill="rgba(255,255,255,0.4)">UAE · KSA · Kuwait · Qatar</text>

  <rect x="480" y="50" width="130" height="70" rx="8" fill="rgba(20,110,245,0.15)" stroke="#146EF5" stroke-width="1" stroke-opacity="0.4"/>
  <text x="545" y="76" font-family="Arial" font-size="22" font-weight="900" text-anchor="middle" fill="#146EF5">6</text>
  <text x="545" y="96" font-family="Arial" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.5)">Industry Sectors</text>
  <text x="545" y="112" font-family="Arial" font-size="9" text-anchor="middle" fill="rgba(255,255,255,0.4)">Est. Business Bay 2021</text>

  <!-- Brand badge -->
  <rect x="0" y="350" width="640" height="50" fill="rgba(20,110,245,0.15)"/>
  <rect x="0" y="350" width="640" height="2" fill="#146EF5"/>
  <text x="320" y="376" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle" fill="#146EF5">CONNECTING GLOBAL SUPPLY TO REGIONAL DEMAND</text>
  <text x="320" y="393" font-family="Arial" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.4)">globalhightrend.com · Business Bay, Dubai, UAE</text>
</svg>
