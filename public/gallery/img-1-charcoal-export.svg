<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1200"/><stop offset="100%" style="stop-color:#2a1a00"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <!-- Stacked charcoal bags/crates -->
  <g>
    <rect x="60" y="200" width="120" height="80" rx="4" fill="#333" stroke="#555" stroke-width="1"/>
    <rect x="190" y="190" width="120" height="80" rx="4" fill="#2d2d2d" stroke="#555" stroke-width="1"/>
    <rect x="320" y="198" width="120" height="80" rx="4" fill="#333" stroke="#555" stroke-width="1"/>
    <rect x="450" y="192" width="120" height="80" rx="4" fill="#2d2d2d" stroke="#555" stroke-width="1"/>
    <!-- Second row -->
    <rect x="120" y="118" width="120" height="80" rx="4" fill="#3a3a3a" stroke="#666" stroke-width="1"/>
    <rect x="255" y="112" width="120" height="80" rx="4" fill="#3a3a3a" stroke="#666" stroke-width="1"/>
    <rect x="390" y="116" width="120" height="80" rx="4" fill="#383838" stroke="#666" stroke-width="1"/>
    <!-- Third row -->
    <rect x="180" y="38" width="120" height="72" rx="4" fill="#444" stroke="#666" stroke-width="1"/>
    <rect x="315" y="34" width="120" height="72" rx="4" fill="#424242" stroke="#666" stroke-width="1"/>
  </g>
  <!-- Labels on crates -->
  <text x="120" y="247" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle" fill="rgba(255,255,255,0.5)">CHARCOAL</text>
  <text x="250" y="237" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle" fill="rgba(255,255,255,0.5)">BRIQUETTE</text>
  <text x="380" y="243" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle" fill="rgba(255,255,255,0.5)">BULK EXPORT</text>
  <!-- Brand badge -->
  <rect x="0" y="350" width="640" height="50" fill="rgba(20,110,245,0.9)"/>
  <text x="320" y="380" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle" fill="white">SAWDUST BRIQUETTE CHARCOAL — BULK EXPORT</text>
</svg>
