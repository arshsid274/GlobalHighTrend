<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <rect width="640" height="400" fill="#e8e8e8"/>
  <rect x="0" y="330" width="640" height="70" fill="#d0d0d0"/>
  <!-- Shelving units -->
  <g fill="#aaa" stroke="#999" stroke-width="1">
    <rect x="20" y="60" width="10" height="260"/><rect x="210" y="60" width="10" height="260"/>
    <rect x="20" y="90" width="200" height="6"/><rect x="20" y="160" width="200" height="6"/>
    <rect x="20" y="230" width="200" height="6"/>
  </g>
  <g fill="#aaa" stroke="#999" stroke-width="1">
    <rect x="430" y="60" width="10" height="260"/><rect x="620" y="60" width="10" height="260"/>
    <rect x="430" y="90" width="200" height="6"/><rect x="430" y="160" width="200" height="6"/>
    <rect x="430" y="230" width="200" height="6"/>
  </g>
  <!-- Parts on shelves left -->
  <!-- Brake discs -->
  <circle cx="60" cy="130" r="30" fill="#666" stroke="#555" stroke-width="2"/>
  <circle cx="60" cy="130" r="18" fill="#888"/><circle cx="60" cy="130" r="8" fill="#555"/>
  <circle cx="120" cy="130" r="25" fill="#666" stroke="#555" stroke-width="2"/>
  <circle cx="120" cy="130" r="15" fill="#888"/><circle cx="120" cy="130" r="6" fill="#555"/>
  <circle cx="175" cy="130" r="28" fill="#666" stroke="#555" stroke-width="2"/>
  <circle cx="175" cy="130" r="17" fill="#888"/><circle cx="175" cy="130" r="7" fill="#555"/>
  <!-- Filters -->
  <rect x="40" y="178" width="30" height="45" rx="6" fill="#c8a000"/>
  <rect x="85" y="175" width="30" height="50" rx="6" fill="#c8a000"/>
  <rect x="130" y="180" width="30" height="42" rx="6" fill="#c89000"/>
  <rect x="175" y="176" width="30" height="48" rx="6" fill="#c8a000"/>
  <!-- Belts/hoses -->
  <path d="M 40 255 Q 60 240 80 255 Q 100 270 120 255 Q 140 240 160 255 Q 180 270 200 255" stroke="#333" stroke-width="6" fill="none"/>
  <!-- Parts right side -->
  <rect x="450" y="100" width="80" height="50" rx="4" fill="#4a4a4a"/>
  <text x="490" y="130" font-family="Arial" font-size="10" font-weight="700" text-anchor="middle" fill="rgba(255,255,255,0.7)">ENGINE FILTER</text>
  <rect x="540" y="100" width="65" height="50" rx="4" fill="#555"/>
  <text x="572" y="130" font-family="Arial" font-size="10" font-weight="700" text-anchor="middle" fill="rgba(255,255,255,0.7)">AIR FILTER</text>
  <!-- Shock absorbers -->
  <rect x="448" y="170" width="18" height="65" rx="5" fill="#666"/>
  <rect x="474" y="170" width="18" height="65" rx="5" fill="#666"/>
  <rect x="500" y="170" width="18" height="65" rx="5" fill="#666"/>
  <rect x="526" y="170" width="18" height="65" rx="5" fill="#666"/>
  <rect x="552" y="170" width="18" height="65" rx="5" fill="#666"/>
  <text x="505" y="256" font-family="Arial" font-size="9" text-anchor="middle" fill="#888">SHOCK ABSORBERS</text>
  <!-- OEM / Aftermarket badges -->
  <rect x="230" y="160" width="190" height="60" rx="10" fill="#0018B2" opacity="0.9"/>
  <text x="325" y="185" font-family="Arial" font-size="16" font-weight="900" text-anchor="middle" fill="white">OEM</text>
  <text x="325" y="208" font-family="Arial" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.7)">ORIGINAL EQUIPMENT MFR.</text>
  <rect x="230" y="230" width="190" height="60" rx="10" fill="#146EF5" opacity="0.85"/>
  <text x="325" y="255" font-family="Arial" font-size="14" font-weight="800" text-anchor="middle" fill="white">AFTERMARKET</text>
  <text x="325" y="275" font-family="Arial" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.7)">QUALITY-CERTIFIED PARTS</text>
  <!-- Brand badge -->
  <rect x="0" y="350" width="640" height="50" fill="rgba(0,24,178,0.9)"/>
  <text x="320" y="380" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle" fill="white">AUTOMOTIVE PARTS — OEM &amp; Aftermarket · Global Supply</text>
</svg>
